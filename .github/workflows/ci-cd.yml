name: Deploy Ionic App Locally

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: [self-hosted, Windows, X64]
    steps:
      - name: Checkout latest code
        uses: actions/checkout@v4

      - name: Build Ionic image
        run: docker build -t jeremy-crud-cor .

      - name: Remove previous container
        run: docker rm -f jeremy-crud-cor-container
        continue-on-error: true

      - name: Start updated container
        run: docker run -d --name jeremy-crud-cor-container --restart unless-stopped -p 8080:80 jeremy-crud-cor

      - name: Verify app
        shell: pwsh
        run: |
          $success = $false
          for ($i = 1; $i -le 15; $i++) {
            try {
              Invoke-WebRequest -Uri http://localhost:8080 -UseBasicParsing -TimeoutSec 5 | Out-Null
              $success = $true
              break
            } catch {
              Start-Sleep -Seconds 2
            }
          }
          if (-not $success) {
            docker logs jeremy-crud-cor-container
            exit 1
          }